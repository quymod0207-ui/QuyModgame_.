<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Layma VIP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #5288c1);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 20px;
        }
        label {
            font-size: 14px;
            color: var(--hint-color);
            display: block;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background-color: var(--button-color);
            color: var(--button-text);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>BYPASS LAYMA.NET VIP</h2>
    <label for="urlInput">Dán đường dẫn cần bypass vào đây:</label>
    <input type="text" id="urlInput" placeholder="https://layma.net/..." />
    <button onclick="sendData()">GỬI YÊU CẦU</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendData() {
        const url = document.getElementById("urlInput").value.trim();
        if (!url) {
            tg.showAlert("Vui lòng nhập đường dẫn!");
            return;
        }
        
        // Gửi dữ liệu URL về lại Bot Telegram
        tg.sendData(url);
        tg.close();
    }
</script>

</body>
</html>
